backend:
  name: git-gateway
  branch: main

media_folder: "img"
public_folder: "img"

collections:
  - name: "propiedades"
    label: "Propiedades"
    files:
      - file: "data/properties.json"
        label: "Lista de Propiedades"
        name: "properties_list"
        fields:
          - label: "Propiedades"
            name: "properties"
            widget: "list"
            fields:
              - { label: "ID", name: "id", widget: "string" }
              - { label: "Título de Tarjeta", name: "title", widget: "string" }
              - { label: "Nombre Proyecto", name: "name", widget: "string" }
              - { label: "Ciudad", name: "city", widget: "string" }
              - { label: "Dirección", name: "address", widget: "string" }
              - { label: "Descripción Corta", name: "description", widget: "string" }
              - label: "Álbumes / Secciones"
                name: "albums"
                widget: "list"
                fields:
                  - { label: "Nombre del Álbum", name: "title", widget: "string" }
                  - label: "Fotografías"
                    name: "images"
                    widget: "list"
                    field: { label: "Imagen", name: "image", widget: "image" }
