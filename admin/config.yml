backend:
  name: github
  repo: TU_USUARIO_GITHUB/NOMBRE_DE_TU_REPOSITORIO
  branch: main
  base_url: https://sveltia-cms-auth.vercel.app # Proxy público y gratuito para OAuth de Decap CMS

media_folder: "assets/images/uploads"
public_folder: "assets/images/uploads"

collections:
  - name: "properties"
    label: "Propiedades"
    files:
      - file: "data/properties.json"
        label: "Lista de Propiedades"
        name: "properties_file"
        fields:
          - label: "Propiedades"
            name: "properties"
            widget: "list"
            summary: '{{fields.name}} - {{fields.city}}'
            fields:
              - { label: "Nombre", name: "name", widget: "string" }
              - { label: "Título / Subtítulo", name: "title", widget: "string" }
              - { label: "Ciudad", name: "city", widget: "string" }
              - { label: "Dirección", name: "address", widget: "string" }
              - { label: "Descripción Corta", name: "description", widget: "text" }
              - label: "Álbumes de Fotos"
                name: "albums"
                widget: "list"
                summary: '{{fields.title}}'
                fields:
                  - { label: "Título del Álbum", name: "title", widget: "string" }
                  - label: "Imágenes del Álbum"
                    name: "images"
                    widget: "list"
                    summary: '{{fields.caption}}'
                    fields:
                      - { label: "Imagen", name: "image", widget: "image" }
                      - { label: "Descripción / Pie de foto (opcional)", name: "caption", widget: "string", required: false }
